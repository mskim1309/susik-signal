<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>수식신호등 - 데블스 플랜3 결승 게임 (팬메이드)</title>
<meta name="description" content="넷플릭스 '데블스 플랜: 데드 어게인'(데블스 플랜3) 결승전 마지막 게임 '수식신호등'을 재현한 팬메이드 웹 게임. 워들처럼 색깔 힌트로 상대의 9칸 수식을 맞혀보세요. 2인 대결, 혼자 연습 모드 지원.">
<meta name="keywords" content="데블스플랜, 데블스 플랜3, 데블스 플랜 데드 어게인, 수식신호등, 수식 신호등, 숫자 신호등, 결승, 수식 워들, Nerdle">
<meta property="og:type" content="website">
<meta property="og:title" content="수식신호등 - 데블스 플랜3 결승 게임">
<meta property="og:description" content="데블스 플랜3 결승전 '수식신호등'을 직접 해보세요. 색깔 힌트로 상대의 수식을 먼저 맞히면 승리!">
<meta name="theme-color" content="#4f6bed">
<style>
:root{--g:#2f9e5e;--y:#e2ae1c;--r:#d9534f;--bd:#cfd3da;--bg:#f4f5f8;--ink:#1d2330;--mut:#6b7280;--acc:#4f6bed;--cs:clamp(28px,8.6vw,40px)}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;align-items:center;min-height:100vh}
header{padding:16px 12px 2px;text-align:center}
h1{margin:0;font-size:26px;letter-spacing:-.5px}
.lights{display:inline-flex;gap:5px;margin-right:8px;vertical-align:middle}
.lights i{width:12px;height:12px;border-radius:50%;display:block}
main{width:100%;max-width:900px;padding:8px 12px 28px;display:flex;flex-direction:column;align-items:center;gap:14px}
.status{font-weight:700;text-align:center;min-height:22px}
.sub{color:var(--mut);font-size:14px;font-weight:500;margin-top:2px}
.boards{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;width:100%}
.board{background:#fff;border-radius:14px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);border:2px solid transparent}
.board.active{border-color:var(--acc)}
.board h2{font-size:15px;margin:0 0 8px;text-align:center}
.board h2 small{display:block;font-weight:500;color:var(--mut);font-size:12px;margin-top:2px}
.row{display:grid;grid-template-columns:repeat(9,var(--cs));gap:5px;margin-bottom:5px;justify-content:center}
.cell{height:var(--cs);border:2px solid var(--bd);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:calc(var(--cs)*.5);background:#fff}
.cell.filled{border-color:#7d8594}
.cell.pend{background:#e7e9ee;border-color:#e7e9ee;color:#4b5263}
.cell.g{background:var(--g);border-color:var(--g);color:#fff}
.cell.y{background:var(--y);border-color:var(--y);color:#fff}
.cell.r{background:var(--r);border-color:var(--r);color:#fff}
.cell.anim{animation:flip .5s ease both}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.kb{display:flex;flex-direction:column;gap:6px;width:100%;max-width:520px}
.krow{display:flex;gap:6px}
.key{flex:1;height:52px;border:none;border-radius:8px;background:#dde1e7;font-size:21px;font-weight:800;cursor:pointer;color:var(--ink);touch-action:manipulation}
.key:active{filter:brightness(.92)}
.key.wide{font-size:16px}
.key.enter{background:var(--acc);color:#fff}
.key.g{background:var(--g);color:#fff}.key.y{background:var(--y);color:#fff}.key.r{background:var(--r);color:#fff}
.btn{padding:12px 20px;border:none;border-radius:10px;background:var(--acc);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.btn.sec{background:#e3e6ec;color:var(--ink)}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.card{background:#fff;border-radius:14px;padding:20px;max-width:540px;width:100%;box-shadow:0 1px 3px rgba(0,0,0,.08);text-align:center}
.card h3{margin:0 0 10px}
.rules{text-align:left;font-size:14px;line-height:1.65;color:#374151;margin:0 0 16px;padding-left:18px}
.chip{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px}
.secret{font-size:20px;font-weight:800;letter-spacing:3px;margin:4px 0}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#1d2330;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.link{background:none;border:none;color:var(--mut);text-decoration:underline;cursor:pointer;font-size:14px}
.tag{margin:6px 0 0;color:var(--mut);font-size:14px}
footer{margin-top:auto;padding:18px 16px 24px;text-align:center;color:var(--mut);font-size:13px;line-height:1.6;max-width:640px}
</style>
</head>
<body>
<header><h1><span class="lights"><i style="background:var(--g)"></i><i style="background:var(--y)"></i><i style="background:var(--r)"></i></span>수식신호등</h1><p class="tag">데블스 플랜3 결승전 게임 재현</p></header>
<main id="app"></main>
<footer>넷플릭스 「데블스 플랜: 데드 어게인」 결승전 게임 ‘수식신호등’을 재미로 재현한 <b>팬메이드 비공식 게임</b>입니다.<br>넷플릭스 및 프로그램 제작사와 관련이 없으며, 세부 규칙은 방송과 다를 수 있습니다.</footer>
<div class="toast" id="toast"></div>
<script>
/* ---------- 규칙 로직 ---------- */
const LEN = 9;
const DISP = {'*':'×','/':'÷','-':'−'};
const show = c => DISP[c] || c;

function parseSide(s){
  if(!s.length) return {ok:false,msg:'= 양쪽에 식이 있어야 해요'};
  const t=[]; let num='';
  const pushNum=()=>{
    if(!num) return '연산 기호가 맨 앞·맨 끝에 있거나 연달아 있어요';
    if(num.length>1 && num[0]==='0') return '0으로 시작하는 숫자(예: 05)는 쓸 수 없어요';
    t.push(+num); num=''; return null;
  };
  for(const ch of s){
    if(ch>='0'&&ch<='9') num+=ch;
    else { const e=pushNum(); if(e) return {ok:false,msg:e}; t.push(ch); }
  }
  const e=pushNum(); if(e) return {ok:false,msg:e};
  return {ok:true,tokens:t};
}

// 계산 순서: ^ (오른쪽부터) → × ÷ → + −
function evalTokens(tokens){
  const t=tokens.slice();
  for(let i=t.length-2;i>=1;i-=2){
    if(t[i]==='^'){
      const b=t[i-1], e=t[i+1];
      t.splice(i-1,3,Math.pow(b,e));
    }
  }
  const r=[t[0]];
  for(let i=1;i<t.length;i+=2){
    const op=t[i], n=t[i+1];
    if(op==='*') r[r.length-1]*=n;
    else if(op==='/'){ if(n===0) return NaN; r[r.length-1]/=n; }
    else r.push(op,n);
  }
  let v=r[0];
  for(let i=1;i<r.length;i+=2) v = r[i]==='+' ? v+r[i+1] : v-r[i+1];
  return v;
}

function check(eq){
  if(eq.length!==LEN) return {ok:false,msg:'9칸을 모두 채우세요'};
  const parts=eq.split('=');
  if(parts.length!==2) return {ok:false,msg:'= 는 정확히 하나 있어야 해요'};
  if(!/[+\-*/^]/.test(eq)) return {ok:false,msg:'연산 기호(+ − × ÷ ^)가 하나 이상 있어야 해요'};
  const L=parseSide(parts[0]); if(!L.ok) return L;
  const R=parseSide(parts[1]); if(!R.ok) return R;
  const a=evalTokens(L.tokens), b=evalTokens(R.tokens);
  if(!isFinite(a)||!isFinite(b)) return {ok:false,msg:'계산할 수 없는 식이에요 (0으로 나누기 등)'};
  if(Math.abs(a-b) > 1e-9*Math.max(1,Math.abs(a),Math.abs(b))) return {ok:false,msg:'양쪽 값이 같지 않아요'};
  return {ok:true};
}

// 워들 방식 채점: g=초록, y=노랑, r=빨강 (중복 글자는 개수만큼만)
function score(guess, secret){
  const res=Array(LEN).fill('r'), left={};
  for(let i=0;i<LEN;i++){
    if(guess[i]===secret[i]) res[i]='g';
    else left[secret[i]]=(left[secret[i]]||0)+1;
  }
  for(let i=0;i<LEN;i++){
    if(res[i]!=='g' && left[guess[i]]>0){ res[i]='y'; left[guess[i]]--; }
  }
  return res;
}

// 혼자 연습용 랜덤 수식 (왼쪽 식 = 오른쪽 숫자)
function randomEquation(){
  const ops=['+','+','-','-','*','*','/','^'];
  for(let k=0;k<300000;k++){
    const leftLen=5+Math.floor(Math.random()*3), rightLen=LEN-1-leftLen;
    let s='', prevOp=true;
    for(let i=0;i<leftLen;i++){
      if(!prevOp && i<leftLen-1 && Math.random()<0.4){ s+=ops[Math.floor(Math.random()*ops.length)]; prevOp=true; }
      else { s+=Math.floor(Math.random()*10); prevOp=false; }
    }
    if(!/[+\-*/^]/.test(s)) continue;
    const p=parseSide(s); if(!p.ok) continue;
    const v=evalTokens(p.tokens);
    if(!isFinite(v) || v<0 || Math.abs(v-Math.round(v))>1e-9) continue;
    const r=String(Math.round(v)); if(r.length!==rightLen) continue;
    const eq=s+'='+r; if(check(eq).ok) return eq;
  }
  return '12*3+4=40';
}

/* ---------- 화면 ---------- */
let S={phase:'menu'};
const mkBoard=()=>({rows:[],cur:'',solved:false});
const target=b=> S.mode==='solo' ? S.secrets[0] : S.secrets[1-b];

function newGame(mode){
  S={mode,phase:mode==='solo'?'play':'setup',setupIdx:0,secrets:[null,null],
     boards:mode==='solo'?[mkBoard()]:[mkBoard(),mkBoard()],active:0,entry:'',round:1,over:null,hide:false};
  if(mode==='solo') S.secrets[0]=randomEquation();
  render();
}

let toastTimer;
function toast(msg){
  const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),1800);
}
function shake(){ const r=document.querySelector('.row.cur'); if(r){ r.classList.remove('shake'); void r.offsetWidth; r.classList.add('shake'); } }

function rowHTML(str,res,opt={}){
  let h='';
  for(let i=0;i<LEN;i++){
    const c=str[i]||'';
    let k='cell';
    if(res) k+=' '+res[i]; else if(opt.pend&&c) k+=' pend'; else if(c) k+=' filled';
    const anim=opt.anim&&res;
    if(anim) k+=' anim';
    h+=`<div class="${k}"${anim?` style="animation-delay:${i*80}ms"`:''}>${c?(opt.hide?'●':show(c)):''}</div>`;
  }
  return `<div class="row${opt.cur?' cur':''}">${h}</div>`;
}

function keyColors(board){
  const rank={r:1,y:2,g:3}, best={};
  if(!board) return best;
  for(const row of board.rows){ if(!row.res) continue;
    for(let i=0;i<LEN;i++){ const c=row.g[i], s=row.res[i]; if(!best[c]||rank[s]>rank[best[c]]) best[c]=s; } }
  return best;
}

function keyboardHTML(colors){
  const rows=[['1','2','3','4','5'],['6','7','8','9','0'],['+','-','*','/','^','='],['DEL','ENTER']];
  return '<div class="kb">'+rows.map(r=>'<div class="krow">'+r.map(k=>{
    if(k==='DEL') return `<button class="key wide" data-k="DEL">⌫ 지우기</button>`;
    if(k==='ENTER') return `<button class="key wide enter" data-k="ENTER">입력</button>`;
    return `<button class="key ${colors[k]||''}" data-k="${k}">${show(k)}</button>`;
  }).join('')+'</div>').join('')+'</div>';
}

function boardHTML(b){
  const B=S.boards[b], solo=S.mode==='solo';
  const isActive=!S.over && S.active===b;
  const title=solo?`컴퓨터의 수식 맞히기<small>${B.rows.length}번 시도</small>`
                  :`플레이어 ${b+1}<small>플레이어 ${2-b}의 수식 맞히기</small>`;
  let h=`<div class="board${isActive?' active':''}"><h2>${title}</h2>`;
  for(const row of B.rows){ h+=rowHTML(row.g,row.res,{anim:row.anim,pend:!row.res}); row.anim=false; }
  if(!S.over && B.rows.length<S.round) h+=rowHTML(isActive?B.cur:'',null,{cur:isActive});
  return h+'</div>';
}

function render(){
  const app=document.getElementById('app');
  if(S.phase==='menu'){
    app.innerHTML=`<div class="card"><h3>규칙</h3><ul class="rules">
      <li>0~9 와 <b>+ − × ÷ ^ =</b> 로 <b>9칸</b>짜리 성립하는 수식을 만들어요.</li>
      <li>계산 순서: <b>^</b> → × ÷ → + − (^는 오른쪽부터, 2^3^2 = 2^9)</li>
      <li><span class="chip" style="background:var(--g)"></span> 자리까지 맞음 &nbsp;<span class="chip" style="background:var(--y)"></span> 있는데 자리 다름 &nbsp;<span class="chip" style="background:var(--r)"></span> 없음<br>같은 글자가 여러 개면 실제 개수만큼만 초록/노랑으로 표시돼요.</li>
      <li>비밀 수식은 성립해야 해요 (05 같은 숫자, 0으로 나누기는 안 돼요. 0^0 = 1). <b>추측은 성립하지 않아도 돼요</b> — 9칸만 채우면 OK.</li>
      <li><b>2인 대결:</b> 매 라운드 두 사람이 추측을 입력하면 결과가 동시에 공개돼요. <b>먼저 맞히는 사람이 승리</b>, 같은 라운드에 둘 다 맞히면 무승부.</li>
      </ul><div class="btns"><button class="btn" data-a="duo">2인 대결 (한 기기)</button><button class="btn sec" data-a="solo">혼자 연습</button></div></div>`;
    return;
  }
  if(S.phase==='setup'){
    const n=S.setupIdx+1;
    app.innerHTML=`<div class="status">플레이어 ${n}, 비밀 수식을 입력하세요<div class="sub">플레이어 ${3-n}은 화면을 보지 마세요!</div></div>
      <div class="board active">${rowHTML(S.entry,null,{cur:true,hide:S.hide})}</div>
      <button class="link" data-a="hide">${S.hide?'입력한 수식 보기':'입력한 수식 가리기'}</button>
      ${keyboardHTML({})}`;
    return;
  }
  if(S.phase==='pass'){
    app.innerHTML=`<div class="card"><h3>플레이어 1 수식 저장 완료</h3><p>기기를 플레이어 2에게 넘겨주세요.</p>
      <button class="btn" data-a="p2">플레이어 2 수식 입력하기</button></div>`;
    return;
  }
  // play
  let status;
  if(S.over){
    status=S.over;
  } else if(S.mode==='solo'){
    status='컴퓨터가 만든 수식을 맞혀보세요';
  } else {
    status=`라운드 ${S.round} · 플레이어 ${S.active+1} 추측 입력`+
      (S.active===1?'<div class="sub">둘 다 입력하면 결과가 동시에 공개돼요</div>':'');
  }
  let h=`<div class="status">${status}</div><div class="boards">${S.boards.map((_,b)=>boardHTML(b)).join('')}</div>`;
  if(S.over){
    h+=`<div class="card">`+(S.mode==='solo'
        ?`<div>정답</div><div class="secret">${[...S.secrets[0]].map(show).join('')}</div>`
        :`<div>플레이어 1의 수식</div><div class="secret">${[...S.secrets[0]].map(show).join('')}</div>
          <div>플레이어 2의 수식</div><div class="secret">${[...S.secrets[1]].map(show).join('')}</div>`)+
       `<div class="btns" style="margin-top:12px"><button class="btn" data-a="again">다시 하기</button><button class="btn sec" data-a="menu">처음으로</button></div></div>`;
  } else {
    h+=keyboardHTML(keyColors(S.boards[S.active]));
    if(S.mode==='solo') h+=`<button class="link" data-a="giveup">포기하고 정답 보기</button>`;
  }
  app.innerHTML=h;
}

function press(k){
  if(S.phase==='setup'){
    if(k==='DEL') S.entry=S.entry.slice(0,-1);
    else if(k==='ENTER'){
      const c=check(S.entry); if(!c.ok){ toast(c.msg); shake(); return; }
      S.secrets[S.setupIdx]=S.entry; S.entry='';
      S.phase = S.setupIdx===0 ? 'pass' : 'play';
    } else if(S.entry.length<LEN) S.entry+=k;
    render(); return;
  }
  if(S.phase!=='play' || S.over) return;
  const B=S.boards[S.active];
  if(k==='DEL'){ B.cur=B.cur.slice(0,-1); render(); return; }
  if(k!=='ENTER'){ if(B.cur.length<LEN) B.cur+=k; render(); return; }
  if(B.cur.length<LEN){ toast('9칸을 모두 채우세요'); shake(); return; }
  if(S.mode==='solo'){
    const res=score(B.cur,target(0));
    B.rows.push({g:B.cur,res,anim:true}); B.cur=''; S.round++;
    if(res.every(x=>x==='g')) S.over=`🎉 ${B.rows.length}번 만에 성공!`;
  } else {
    B.rows.push({g:B.cur,res:null}); B.cur='';
    if(S.active===0){ S.active=1; }
    else {
      S.boards.forEach((bd,i)=>{ const row=bd.rows[bd.rows.length-1]; row.res=score(row.g,target(i)); row.anim=true; bd.solved=row.res.every(x=>x==='g'); });
      const [a,b]=S.boards.map(x=>x.solved);
      if(a&&b) S.over=`🤝 라운드 ${S.round}, 둘 다 맞혔어요! 무승부`;
      else if(a||b) S.over=`🎉 플레이어 ${a?1:2} 승리! (라운드 ${S.round})`;
      else { S.active=0; S.round++; }
    }
  }
  render();
}

function init(){
  document.addEventListener('click',e=>{
    const key=e.target.closest('[data-k]'); if(key){ press(key.dataset.k); return; }
    const a=e.target.closest('[data-a]'); if(!a) return;
    const act=a.dataset.a;
    if(act==='duo'||act==='solo') newGame(act);
    else if(act==='p2'){ S.setupIdx=1; S.phase='setup'; S.hide=false; render(); }
    else if(act==='hide'){ S.hide=!S.hide; render(); }
    else if(act==='again') newGame(S.mode);
    else if(act==='menu'){ S={phase:'menu'}; render(); }
    else if(act==='giveup'){ S.over='정답을 공개했어요'; render(); }
  });
  document.addEventListener('keydown',e=>{
    if(S.phase!=='setup'&&S.phase!=='play') return;
    let k=e.key;
    if(k==='Enter') k='ENTER'; else if(k==='Backspace') k='DEL';
    else if(k==='x'||k==='X') k='*';
    if(/^[0-9+\-*/^=]$/.test(k)||k==='ENTER'||k==='DEL'){ e.preventDefault(); press(k); }
  });
  render();
}
if(typeof document!=='undefined') init();
</script>
</body>
</html>
